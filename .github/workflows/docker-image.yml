name: docker-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Compute release metadata
        shell: bash
        run: |
          COMMIT_SUBJECT="$(git log -1 --pretty=%s)"
          SAFE_SUBJECT="${COMMIT_SUBJECT//[^a-zA-Z0-9 ._-]/-}"
          TS="$(date +%Y%m%d-%H%M%S)"
          echo "RELEASE_TAG=${GITHUB_REF_NAME:-manual-${TS}}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=${SAFE_SUBJECT}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            --tag "ghcr.io/${IMAGE_OWNER}/initiative-tracker:${GITHUB_SHA}" \
            --tag "ghcr.io/${IMAGE_OWNER}/initiative-tracker:${{ env.RELEASE_TAG }}" \
            .

      - name: Smoke test the built container
        env:
          DM_PASSWORD: test-password
          PUBLIC_ORIGIN: http://127.0.0.1:3000
          ALLOW_INSECURE_ORIGIN: "true"
        run: |
          docker run -d --rm --name initiative-tracker-ci \
            -p 3000:3000 \
            -e DM_PASSWORD="${DM_PASSWORD}" \
            -e PUBLIC_ORIGIN="${PUBLIC_ORIGIN}" \
            -e ALLOW_INSECURE_ORIGIN="${ALLOW_INSECURE_ORIGIN}" \
            -e PORT=3000 \
            -e HOST=0.0.0.0 \
            -e TRUST_PROXY=1 \
            -e DATABASE_PATH=/data/initiative.sqlite \
            -v initiative-tracker-ci-data:/data \
            "ghcr.io/${IMAGE_OWNER}/initiative-tracker:${GITHUB_SHA}"

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS http://127.0.0.1:3000/ | grep -Ei 'Rivergate|initiative|tracker'

          docker rm -f initiative-tracker-ci

      - name: Export tarball
        run: |
          docker save "ghcr.io/${IMAGE_OWNER}/initiative-tracker:${GITHUB_SHA}" \
            | gzip > "initiative-tracker-${GITHUB_SHA}.tar.gz"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          files: initiative-tracker-${{ github.sha }}.tar.gz
